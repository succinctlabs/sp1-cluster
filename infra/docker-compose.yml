services:
  # Redis service
  redis:
    image: bitnamisecure/redis:latest
    environment:
      - REDIS_PASSWORD=redispassword
      - REDIS_AOF_ENABLED=no
      # Keep below the cgroup limit; RSS overshoots maxmemory via fragmentation.
      # Sized ~6x the observed artifact peak (1.5G) on this 2-GPU box; a deeper
      # proof backlog needs this raised.
      - REDIS_EXTRA_FLAGS=--maxmemory 10gb
    volumes:
      - redis_data:/bitnami/redis/data
    ports:
      - "127.0.0.1:6379:6379"
    deploy:
      resources:
        limits:
          memory: 12G
        reservations:
          memory: 12G

  # PostgreSQL database
  postgresql:
    image: bitnamisecure/postgresql:latest
    environment:
      - POSTGRES_PASSWORD=postgrespassword
      - POSTGRES_USER=postgres
      - POSTGRES_DB=postgres
    volumes:
      - postgresql_data:/bitnami/postgresql
    ports:
      - "5432:5432"

  # API Service
  api:
    image: ghcr.io/succinctlabs/sp1-cluster:base-2407b9c
    environment:
      - API_GRPC_ADDR=0.0.0.0:50051
      - API_HTTP_ADDR=0.0.0.0:3000
      - API_AUTO_MIGRATE=true
      - API_DATABASE_URL=postgresql://postgres:postgrespassword@postgresql:5432/postgres
    ports:
      - "127.0.0.1:50051:50051"
    depends_on:
      - postgresql

  # Coordinator Service
  coordinator:
    image: ghcr.io/succinctlabs/sp1-cluster:base-2407b9c
    environment:
      - COORDINATOR_CLUSTER_RPC=http://api:50051
      - COORDINATOR_METRICS_ADDR=0.0.0.0:9090
      - COORDINATOR_ADDR=0.0.0.0:50051
      - SP1_CLUSTER_SHARD_THRESHOLD=402653184
    command: ["/bin/sh", "-c", "/coordinator"]
    # Expose coordinator for remote workers connecting from other machines.
    ports:
      - "0.0.0.0:50053:50051"
    depends_on:
      - api

  # CPU Node
  cpu-node:
    image: ghcr.io/succinctlabs/sp1-cluster:base-2407b9c
    environment:
      - NODE_COORDINATOR_RPC=http://coordinator:50051
      # Concurrency budget: GiB of RAM dedicated to THIS worker, not the host total.
      # On a shared host (redis/coordinator/etc. co-located) the container memory limit
      # overstates what the worker owns, so the auto-derived budget over-admits tasks —
      # pin it explicitly. Keep below deploy.resources.limits.memory: the budget only
      # counts task working sets, not the worker's resident baseline. 34 = two
      # overlapping CoreExecutes plus controllers; raise by >=14 per concurrent
      # Groth16Wrap if wrap requests arrive via the gateway/SPN.
      - WORKER_MAX_WEIGHT_OVERRIDE=34
      # Task weights are stamped at task creation by the controller running HERE —
      # GPU nodes only read the stamped value, so these must be set on this worker.
      # Raised over the defaults (4/8) because SP1_CLUSTER_SHARD_THRESHOLD below is
      # 2x the cluster default (it's the full sp1 ELEMENT_THRESHOLD). Calibrated
      # against measured v6/rsp cgroup peaks, not doubled blindly: ~2.7GiB avg
      # incremental per in-flight ProveShard on the GPU workers (peak-ish 6), and
      # ~12-13GiB per CoreExecute here. Shard weight 8 halved GPU pipeline depth
      # and cost ~30% e2e (44s -> 57s); keep weight x depth aligned with the GPU
      # workers' WORKER_MAX_WEIGHT_OVERRIDE (4 shards in flight).
      - WORKER_PROVE_SHARD_WEIGHT=6
      - WORKER_CORE_EXECUTE_WEIGHT=16
      - NODE_ARTIFACT_STORE=redis
      - SP1_CLUSTER_SHARD_THRESHOLD=402653184
      - NODE_REDIS_NODES=redis://:redispassword@redis:6379/0
      - WORKER_TYPE=CPU
    volumes:
      - ${HOME}/.sp1/circuits:/root/.sp1/circuits
    command: ["/bin/sh", "-c", "/node"]
    # Keep shm_size <= the memory limit: shm pages count against the cgroup, and a
    # larger shm just converts "tmpfs full" errors into OOM kills.
    shm_size: 44G
    deploy:
      resources:
        limits:
          cpus: "8"
          memory: 44G
        reservations:
          cpus: "8"
          memory: 44G
    depends_on:
      - coordinator
      - redis

  # CPU Node
  mixed:
    image: ghcr.io/succinctlabs/sp1-cluster:base-2407b9c
    environment:
      - NODE_COORDINATOR_RPC=http://coordinator:50051
      # See cpu-node: GiB dedicated to this worker, at most the 96G limit below.
      - WORKER_MAX_WEIGHT_OVERRIDE=60
      - NODE_ARTIFACT_STORE=redis
      - SP1_CLUSTER_SHARD_THRESHOLD=402653184
      - NODE_REDIS_NODES=redis://:redispassword@redis:6379/0
      - WORKER_TYPE=ALL
    volumes:
      - ${HOME}/.sp1/circuits:/root/.sp1/circuits
    command: ["/bin/sh", "-c", "/app/sp1-cluster-node"]
    shm_size: 96G
    deploy:
      resources:
        limits:
          cpus: "8"
          memory: 60G
        reservations:
          cpus: "8"
          memory: 60G
    depends_on:
      - coordinator
      - redis

  # GPU Node
  gpu0:
    image: ghcr.io/succinctlabs/sp1-cluster:node-gpu-2407b9c
    environment:
      - NODE_COORDINATOR_RPC=http://coordinator:50051
      # Budget for task working sets only. The GPU node also holds a ~11.5 GiB
      # resident baseline (CUDA/driver shared memory), so keep
      # baseline + override <= deploy.resources.limits.memory — 18/18G ignored the
      # baseline and got memcg OOM-killed. 24 = 4 ProveShards (weight 6) or
      # 3 shards + 2 reduces in flight, the depth that measured 44s on v6/rsp;
      # depth 2 measured 57s (GPU stalls on per-shard fetch+tracegen, which runs
      # in THIS worker — a short queue starves the GPU even when the cpu-node is
      # producing tasks quickly).
      - WORKER_MAX_WEIGHT_OVERRIDE=24
      - NODE_ARTIFACT_STORE=redis
      - NODE_REDIS_NODES=redis://:redispassword@redis:6379/0
      - WORKER_TYPE=GPU
      - SP1_WORKER_VERIFY_INTERMEDIATES=false
    deploy:
      resources:
        limits:
          cpus: "20"
          memory: 28G
        reservations:
          cpus: "20"
          memory: 28G
    depends_on:
      - coordinator
      - redis
      - cpu-node
    # GPU support - uncomment if you have NVIDIA GPU support configured with docker
    runtime: nvidia

  gpu1:
    environment:
      - CUDA_VISIBLE_DEVICES=1
    extends:
      service: gpu0

  gpu2:
    environment:
      - CUDA_VISIBLE_DEVICES=2
    extends:
      service: gpu0

  gpu3:
    environment:
      - CUDA_VISIBLE_DEVICES=3
    extends:
      service: gpu0

  gpu4:
    environment:
      - CUDA_VISIBLE_DEVICES=4
    extends:
      service: gpu0

  gpu5:
    environment:
      - CUDA_VISIBLE_DEVICES=5
    extends:
      service: gpu0

  gpu6:
    environment:
      - CUDA_VISIBLE_DEVICES=6
    extends:
      service: gpu0

  gpu7:
    environment:
      - CUDA_VISIBLE_DEVICES=7
    extends:
      service: gpu0

  # Fulfiller Service
  # DOMAIN: set to SPN_MAINNET_V1_DOMAIN for mainnet, defaults to SPN_SEPOLIA_V1_DOMAIN
  fulfiller:
    image: ghcr.io/succinctlabs/sp1-cluster:base-2407b9c
    environment:
      - FULFILLER_CLUSTER_RPC=http://api:50051
      - FULFILLER_LOG_FORMAT=Pretty
      - FULFILLER_CLUSTER_ARTIFACT_STORE=redis
      - FULFILLER_VERSION=sp1-v6.1.0
      - FULFILLER_DOMAIN=${DOMAIN:-SPN_SEPOLIA_V1_DOMAIN}
      - FULFILLER_CLUSTER_REDIS_NODES=redis://:redispassword@redis:6379/0
      - FULFILLER_METRICS_ADDR=0.0.0.0:9090
      - FULFILLER_RPC_GRPC_ADDR=${RPC_GRPC_ADDR}
      - FULFILLER_SP1_PRIVATE_KEY=${SP1_PRIVATE_KEY}
    depends_on:
      - coordinator
      - redis
    command: ["/bin/sh", "-c", "/fulfiller"]

  # SDK-compatible gateway (opt-in via `--profile gateway`).
  #
  # GATEWAY_PUBLIC_HTTP_URL must be reachable from the *SDK caller* — that's
  # why the default points at 127.0.0.1:8081 (same host as compose). For
  # remote SDK callers, override it to your public hostname.
  network-gateway:
    image: ghcr.io/succinctlabs/sp1-cluster:base-2407b9c
    profiles: ["gateway"]
    environment:
      - GATEWAY_GRPC_ADDR=0.0.0.0:50061
      - GATEWAY_HTTP_ADDR=0.0.0.0:8081
      - GATEWAY_PUBLIC_HTTP_URL=${GATEWAY_PUBLIC_HTTP_URL:-http://127.0.0.1:8081}
      - GATEWAY_CLUSTER_RPC=http://api:50051
      - GATEWAY_ARTIFACT_STORE=redis
      - GATEWAY_REDIS_NODES=redis://:redispassword@redis:6379/0
      - GATEWAY_PROGRAM_STORE=memory
      - GATEWAY_AUTH_MODE=${GATEWAY_AUTH_MODE:-none}
    ports:
      - "0.0.0.0:50061:50061"
      - "0.0.0.0:8081:8081"
    command: ["/bin/sh", "-c", "/network-gateway"]
    depends_on:
      - api
      - redis

  # Bidder Service
  bidder:
    image: ghcr.io/succinctlabs/sp1-cluster:base-2407b9c
    environment:
      - BIDDER_LOG_FORMAT=Pretty
      - BIDDER_VERSION=sp1-v6.1.0
      - BIDDER_DOMAIN=${DOMAIN:-SPN_SEPOLIA_V1_DOMAIN}
      - BIDDER_METRICS_ADDR=0.0.0.0:9090
      - BIDDER_RPC_GRPC_ADDR=${RPC_GRPC_ADDR}
      - BIDDER_SP1_PRIVATE_KEY=${SP1_PRIVATE_KEY}
      - BIDDER_THROUGHPUT_MGAS=1
      - BIDDER_MAX_CONCURRENT_PROOFS=1
      # Static bid in wei/PGU. Safety-net when the USD bid falls back (cache missing
      # or stale), or the unconditional bid if you opt out of the USD bid below.
      - BIDDER_BID_AMOUNT=500000000
      # USD-denominated bid is enabled by default. USD revenue per PGU stays predictable
      # across PROVE-price moves, and your bids stay within requester price limits.
      # Override the target via BIDDER_USD_BID_TARGET=<µUSD per BPGU> or opt out
      # entirely with BIDDER_USD_BID_ENABLED=false (falls back to BIDDER_BID_AMOUNT —
      # PROVE revenue is then fixed, but bids can fall outside requester limits when
      # PROVE moves significantly).
    command: ["/bin/sh", "-c", "/bidder"]

volumes:
  redis_data:
  postgresql_data:
