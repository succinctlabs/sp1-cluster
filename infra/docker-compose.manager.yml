# Management Node Docker Compose
# Includes: API, Coordinator, CPU Node, Redis, PostgreSQL, Alloy
# REDIS_PASSWORD goes into a redis:// URL, so use URL-safe characters only.
# Generate it with `openssl rand -hex 32`.

# Docker's json-file driver never rotates by default.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "500m"
    max-file: "5"

services:
  # Alloy observability service (local to management node)
  alloy:
    logging: *default-logging
    build:
      context: .
      dockerfile: Dockerfile.alloy
    volumes:
      - ./config.alloy:/etc/alloy/test.alloy
    ports:
      - "12345:12345"
      - "4317:4317"
      - "4318:4318"
    command:
      [
        "run",
        "--server.http.listen-addr=0.0.0.0:12345",
        "--storage.path=/var/lib/alloy/data",
        "/etc/alloy/test.alloy",
      ]

  # Redis service (exposed for GPU workers; firewall port 6379 to worker IPs)
  redis:
    image: bitnamisecure/redis:latest
    logging: *default-logging
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?set REDIS_PASSWORD}
      - REDIS_AOF_ENABLED=no
      # Keep below the cgroup limit; RSS overshoots maxmemory via fragmentation.
      - REDIS_EXTRA_FLAGS=--maxmemory 96gb
    volumes:
      - redis_data:/bitnami/redis/data
    ports:
      - "0.0.0.0:6379:6379"
    deploy:
      resources:
        limits:
          memory: 100G
        reservations:
          memory: 100G

  # PostgreSQL database (internal only)
  # docker compose -f docker-compose.manager.yml exec postgresql psql -U  postgres -d postgres
  postgresql:
    image: bitnamisecure/postgresql:latest
    logging: *default-logging
    environment:
      - POSTGRES_PASSWORD=postgrespassword
      - POSTGRES_USER=postgres
      - POSTGRES_DB=postgres
    volumes:
      - postgresql_data:/bitnami/postgresql

  # API Service (local only: GPU workers talk to the coordinator and Redis, not the API)
  api:
    image: ghcr.io/succinctlabs/sp1-cluster:base-latest
    logging: *default-logging
    environment:
      - API_GRPC_ADDR=0.0.0.0:50051
      - API_HTTP_ADDR=0.0.0.0:3000
      - API_AUTO_MIGRATE=true
      - API_DATABASE_URL=postgresql://postgres:postgrespassword@postgresql:5432/postgres
      - CLUSTER_ACCESS_TOKEN=${CLUSTER_ACCESS_TOKEN:?set CLUSTER_ACCESS_TOKEN}
      - CLUSTER_AUTH_REQUIRED=${CLUSTER_AUTH_REQUIRED:-true}
      - OTLP_ENDPOINT=http://alloy:4317
      - RUST_LOG=debug,tower=info,h2=info,tonic-web=info,hyper-util=info
    ports:
      - "127.0.0.1:50051:50051"
      - "127.0.0.1:3000:3000"
    depends_on:
      - postgresql
      - alloy

  # Coordinator Service (exposed for GPU workers; firewall port 50053 to worker IPs)
  # Host port 50053 = coordinator. Remote workers connect here:
  #   NODE_COORDINATOR_RPC=http://<MANAGER_IP>:50053
  # and must send the same CLUSTER_ACCESS_TOKEN. This connection has no encryption.
  # Keep the manager and workers on a private network or VPN.
  coordinator:
    image: ghcr.io/succinctlabs/sp1-cluster:base-latest
    logging: *default-logging
    environment:
      - COORDINATOR_CLUSTER_RPC=http://api:50051
      - COORDINATOR_METRICS_ADDR=0.0.0.0:9090
      - COORDINATOR_ADDR=0.0.0.0:50051
      - CLUSTER_ACCESS_TOKEN=${CLUSTER_ACCESS_TOKEN:?set CLUSTER_ACCESS_TOKEN}
      - CLUSTER_AUTH_REQUIRED=${CLUSTER_AUTH_REQUIRED:-true}
      - RUST_LOG=debug,tower=info,h2=info,tonic-web=info
      - OTLP_ENDPOINT=http://alloy:4317
    command: ["/bin/sh", "-c", "/coordinator"]
    ports:
      - "0.0.0.0:50053:50051"
    depends_on:
      - api

  # Docker creates the circuit-cache volume owned by root. The worker runs as UID
  # 1001, so give it the volume first.
  circuit-cache-init:
    image: ghcr.io/succinctlabs/sp1-cluster:base-latest
    logging: *default-logging
    user: "0:0"
    entrypoint: ["/bin/sh", "-c", "chown -R 1001:1001 /var/cache/sp1/circuits"]
    volumes:
      - circuit-cache:/var/cache/sp1/circuits

  # CPU Node (local to management node)
  cpu-node:
    image: ghcr.io/succinctlabs/sp1-cluster:base-latest
    logging: *default-logging
    environment:
      - NODE_COORDINATOR_RPC=http://coordinator:50051
      # Must be <= container memory in GB (see deploy.resources.limits.memory below).
      - WORKER_MAX_WEIGHT_OVERRIDE=96
      - NODE_ARTIFACT_STORE=redis
      - NODE_REDIS_NODES=redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/0
      - CLUSTER_ACCESS_TOKEN=${CLUSTER_ACCESS_TOKEN:?set CLUSTER_ACCESS_TOKEN}
      - WORKER_TYPE=CPU
      - TRACING_ENABLED=true
      - SP1_WORKER_NUM_SPLICING_WORKERS=12
      - SP1_WORKER_SPLICING_BUFFER_SIZE=12
      - SP1_WORKER_NUMBER_OF_SEND_SPLICE_WORKERS_PER_SPLICE=4
      - SP1_WORKER_SEND_SPLICE_INPUT_BUFFER_SIZE_PER_SPLICE=4
      # - SP1_WORKER_USE_FIXED_PK=true
      - MINIMAL_TRACE_CHUNK_THRESHOLD=33554432
      - RUST_LOG=debug,tower=info,h2=info
      - OTLP_ENDPOINT=http://alloy:4317
      - PROOF_DURATIONS_CSV=/data/proof_durations.csv
      - SP1_GROTH16_CIRCUIT_PATH=/var/cache/sp1/circuits/groth16
      - SP1_PLONK_CIRCUIT_PATH=/var/cache/sp1/circuits/plonk
    volumes:
      - circuit-cache:/var/cache/sp1/circuits
      - ./data:/data
    command: ["/bin/sh", "-c", "/node"]
    shm_size: 96G
    deploy:
      resources:
        limits:
          memory: 96G
        reservations:
          memory: 96G

    depends_on:
      coordinator:
        condition: service_started
      redis:
        condition: service_started
      circuit-cache-init:
        condition: service_completed_successfully

volumes:
  redis_data:
  postgresql_data:
  circuit-cache:
