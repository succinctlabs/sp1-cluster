# Worker Node Docker Compose
# Runs on separate machines, connecting to the management node.
#
# Same machine as manager: docker compose up
# Remote machine: MANAGER_HOST=<ip> docker compose up

services:
  # Alloy observability service (local to this worker)
  alloy:
    build:
      context: .
      dockerfile: Dockerfile.alloy
    volumes:
      - ./config.alloy:/etc/alloy/test.alloy
    ports:
      - "12345:12345"
      - "4317:4317"
      - "4318:4318"
    command:
      [
        "run",
        "--server.http.listen-addr=0.0.0.0:12345",
        "--storage.path=/var/lib/alloy/data",
        "/etc/alloy/test.alloy",
      ]

  # # Redis service (exposed for GPU workers)
  # redis:
  #   image: bitnamisecure/redis:latest
  #   environment:
  #     - REDIS_PASSWORD=redispassword
  #     - REDIS_AOF_ENABLED=no
  #     # Keep below the cgroup limit; RSS overshoots maxmemory via fragmentation.
  #     - REDIS_EXTRA_FLAGS=--maxmemory 96gb
  #   volumes:
  #     - redis_data:/bitnami/redis/data
  #   ports:
  #     - "0.0.0.0:6379:6379"
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 100G
  #       reservations:
  #         memory: 100G

  # GPU Node 0
  gpu0:
    image: ghcr.io/succinctlabs/sp1-cluster:node-gpu-latest
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NODE_COORDINATOR_RPC=http://${MANAGER_HOST:-host.docker.internal}:50053
      # Must be <= container memory in GB (see deploy.resources.limits.memory below).
      - WORKER_MAX_WEIGHT_OVERRIDE=24
      - NODE_ARTIFACT_STORE=redis
      - NODE_REDIS_NODES=redis://:redispassword@${MANAGER_HOST:-host.docker.internal}:6379/0
      - WORKER_TYPE=GPU
      - RUST_LOG=debug,tower=info,h2=info,tonic-web=info,hyper-util=info
      - TRACING_ENABLED=true
      - OTLP_ENDPOINT=http://alloy:4317
      - NO_COLOR=true
      # - SP1_WORKER_USE_FIXED_PK=true
      # - SP1_WORKER_VERIFY_INTERMEDIATES=false
      - CUDA_VISIBLE_DEVICES=0
    deploy:
      resources:
        limits:
          memory: 80G
        reservations:
          memory: 80G
    depends_on:
      - alloy
    runtime: nvidia

