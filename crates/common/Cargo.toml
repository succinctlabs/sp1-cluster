[package]
name = "sp1-cluster-common"
publish = false
version.workspace = true
edition.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["tokio-blocked"]
tokio-blocked = ["dep:tokio-blocked"]

[dependencies]
backoff = { workspace = true, features = ["futures", "tokio"] }
eyre.workspace = true
futures.workspace = true
http.workspace = true
if-addrs.workspace = true
lazy_static.workspace = true
log.workspace = true
opentelemetry.workspace = true
opentelemetry-appender-tracing.workspace = true
opentelemetry-otlp = { workspace = true, features = ["tokio", "logs"] }
opentelemetry_sdk = { workspace = true, features = ["logs", "logs_level_enabled", "rt-tokio"] }
rustls = { workspace = true, features = ["ring"] }
serde.workspace = true
serde_json.workspace = true
sp1-prover-types = { workspace = true }
subtle.workspace = true
tokio.workspace = true
tokio-blocked = { workspace = true, optional = true }
tokio-util = { workspace = true }
tonic.workspace = true
tonic-web.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-opentelemetry.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }

[build-dependencies]
chrono.workspace = true

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
