[graph]
all-features = true

[advisories]
ignore = [
  { id = "RUSTSEC-2021-0139", reason = "Transitive through tracing-forest in sp1. sp1 must drop it first." },
  { id = "RUSTSEC-2021-0141", reason = "Direct dependency of most sp1-cluster crates. Switching to dotenvy removes it." },
  { id = "RUSTSEC-2024-0384", reason = "Transitive through backoff. Replacing backoff removes it." },
  { id = "RUSTSEC-2024-0436", reason = "Transitive through several crates, including alloy-primitives and dashu-macros. Each one must drop it first." },
  { id = "RUSTSEC-2025-0012", reason = "Direct dependency of sp1-cluster and sp1-sdk. Both must switch to a maintained retry crate." },
  { id = "RUSTSEC-2025-0119", reason = "Transitive through indicatif 0.17 in sp1-prover. sp1 must upgrade indicatif first." },
  { id = "RUSTSEC-2025-0141", reason = "Direct dependency of sp1-cluster, sp1 and spn crates. Moving to a maintained serializer removes it." },
  { id = "RUSTSEC-2026-0098", reason = "Transitive through aws-sdk-s3 default features. Turning them off here and in spn-artifacts removes it." },
  { id = "RUSTSEC-2026-0099", reason = "Transitive through aws-sdk-s3 default features. Turning them off here and in spn-artifacts removes it." },
  { id = "RUSTSEC-2026-0104", reason = "Transitive through aws-sdk-s3 default features. Turning them off here and in spn-artifacts removes it." },
  { id = "RUSTSEC-2026-0173", reason = "Transitive through alloy-sol-macro 1.5 and dynasm 3. Upgrading both removes it." },
  { id = "RUSTSEC-2026-0258", reason = "Transitive through opentelemetry-otlp 0.16 and the aws-sdk-s3 defaults. Upgrading opentelemetry and turning off those defaults removes it." },
  { id = "RUSTSEC-2026-0346", reason = "Transitive through aws-sdk-s3 default features. Turning them off here and in spn-artifacts removes it." },
  { id = "RUSTSEC-2026-0349", reason = "Transitive through aws-sdk-s3 default features. Turning them off here and in spn-artifacts removes it." },
  { id = "RUSTSEC-2026-0382", reason = "Transitive through aws-sdk-s3 default features. Turning them off here and in spn-artifacts removes it." },
]

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]
exceptions = [
  { allow = ["CC0-1.0"], crate = "tiny-keccak" },
  # sp1-cluster enables `bigint-rug` on sp1-core-machine, so worker and node builds link these.
  { allow = ["LGPL-3.0-or-later"], crate = "rug" },
  { allow = ["LGPL-3.0-or-later"], crate = "gmp-mpfr-sys" },
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-org = { github = ["succinctlabs"] }
